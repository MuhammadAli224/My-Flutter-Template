name: flutter_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Core
  dartz: ^0.10.1
  gap: ^3.1.0
  jiffy: ^6.4.5
  flutter_dotenv:
  logger:

  # Networking
  connectivity_plus: ^7.3.2
  dio: ^5.11.1

  # State Management
  bloc: ^9.2.1
  equatable:
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0

  # Dependency Injection
  get_it: ^9.3.0

  # Storage and Security
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0

  # Models and Code Generation Annotations
  auto_mappr_annotation: ^2.6.0
  freezed_annotation:
  json_annotation:

  # Routing
  go_router: ^18.1.4

  # UI
  auto_size_text:
  flutter_carousel_widget:
  flutter_screenutil: ^5.9.3
  lottie: ^3.8.2
  shimmer:

  # Files and Images
  cached_network_image_plus:
  image_picker: ^1.2.4
  path:
  path_provider: ^2.1.6
  # pretty_qr_code:

  # Localization
  easy_localization: ^3.0.8

  # Notifications
  awesome_notifications: ^0.12.1
  onesignal_flutter: ^5.8.0

  # Firebase
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  # Code Generation
  auto_mappr: ^2.18.0
  build_runner: ^2.15.0
  freezed: ^4.0.3
  hive_ce_generator: ^1.11.1
  json_serializable: ^6.15.2

  # Flutter Tooling
  flutter_lints:
  flutter_native_splash:

  #  flutter pub run build_runner build --delete-conflicting-outputs
  #  flutter pub run build_runner watch --delete-conflicting-outputs
  #  dart run easy_localization:generate -S assets/translations -s en.json -f keys -o app_strings.g.dart


flutter:
  uses-material-design: true
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai/Almarai-Regular.ttf
        - asset: assets/fonts/Almarai/Almarai-Bold.ttf

  assets:
    - assets/
    - assets/fonts/
    - assets/fonts/Almarai/
    - assets/images/
    - assets/lottie/
    - assets/translations/

    - .env
